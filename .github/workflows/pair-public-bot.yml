name: Pair Extraordinaire public bot test

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/pair-public-bot.yml"

permissions:
  contents: write

jobs:
  create-coauthored-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create public bot contribution
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="achievement/pair-public-bot-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          mkdir -p .github
          printf "Official GitHub Actions bot contribution.\nRun: %s\n" "$GITHUB_RUN_ID" > .github/pair-public-bot-contribution.md
          git add .github/pair-public-bot-contribution.md
          git commit -m "chore: add GitHub Actions bot contribution

          Co-authored-by: Elias Zare <1eliaszare1@gmail.com>"
          git push origin "$BRANCH"
